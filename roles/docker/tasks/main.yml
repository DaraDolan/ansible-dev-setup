---
# Opt-in: set `install_docker: true` in personal-config.yml. Off by default
# because many Windows users already run Docker Desktop, whose WSL
# integration conflicts with Docker Engine installed inside the distro.

- name: Docker Engine skipped (install_docker is false)
  debug:
    msg: >-
      Skipping Docker Engine: install_docker is false. To install it, set
      `install_docker: true` in personal-config.yml, but not if you use
      Docker Desktop (the two conflict).
  when: not (install_docker | bool)

# Static import: the `when` is applied to every task in install.yml, and the
# role's `docker` tag is inherited, so `--tags docker` works either way.
- name: Install Docker Engine
  import_tasks: install.yml
  when: install_docker | bool
