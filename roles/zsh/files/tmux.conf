# ---------------------------------------------------------------------------
# MANAGED BY ANSIBLE - roles/zsh/files/tmux.conf (deployed to ~/.tmux.conf)
#
# Edit here (in the repo, not ~/.tmux.conf) and re-run:
#     ansible-playbook playbook.yml --tags zsh -K
# Reload inside tmux without restarting: prefix + r
#
# The prefix is the default Ctrl-b, so every tmux guide on the internet
# matches this setup. See docs/tmux-guide.md for the workflow guide.
# ---------------------------------------------------------------------------

# --- Quality of life -------------------------------------------------------
set -g mouse on                   # click panes/windows, drag borders, wheel-scroll
set -g history-limit 50000
set -g base-index 1               # windows number from 1 (0 is far from 2 on the keyboard)
setw -g pane-base-index 1
set -g renumber-windows on        # closing window 2 of 3 renumbers 3 -> 2
set -sg escape-time 0             # no Esc delay (Neovim mode switching feels instant)
set -g focus-events on            # Neovim autoread notices file changes
set -g set-clipboard on           # copy in tmux lands on the system clipboard

# True color so Neovim/Starship look identical inside and outside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"

# --- Keybindings -----------------------------------------------------------
# Splits that read like what they do (defaults % and " still work)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# New windows open in the directory you were in, not $HOME
bind c new-window -c "#{pane_current_path}"

# Scrollback/copy mode uses vi keys (prefix + [ to enter, v select, y yank)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Reload this file
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# --- Status bar (matches the Tokyo Night starship prompt) ------------------
set -g status-style "bg=#1d2230,fg=#a0a9cb"
set -g status-left "#[bg=#769ff0,fg=#1d2230,bold] #S #[bg=#1d2230] "
set -g status-left-length 30
set -g status-right "#[fg=#a0a9cb] %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[bg=#394260,fg=#769ff0,bold] #I:#W "
set -g pane-active-border-style "fg=#769ff0"
set -g pane-border-style "fg=#394260"
