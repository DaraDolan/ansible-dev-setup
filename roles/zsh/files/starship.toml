# ---------------------------------------------------------------------------
# MANAGED BY ANSIBLE - roles/zsh/files/starship.toml
#
# Starship prompt configuration - https://starship.rs/config/
# Layout based on the official tokyo-night preset (`starship preset
# tokyo-night`), re-coloured with the Nord palette to match Neovim (nord-vim),
# tmux and the Windows Terminal "Nord" scheme. Local tweaks marked below.
#
# Nord: polar night #2e3440 #3b4252 #434c5e #4c566a, snow #d8dee9 #eceff4,
#       frost #88c0d0 #81a1c1, aurora red #bf616a yellow #ebcb8b green #a3be8c
# Edit here (in the repo, not ~/.config/starship.toml) and re-run:
#     ansible-playbook playbook.yml --tags zsh -K
# ---------------------------------------------------------------------------

"$schema" = 'https://starship.rs/config-schema.json'

# Local tweak: some segments shell out (git, language version lookups);
# don't let a slow one hang the prompt.
command_timeout = 1000

# Local tweaks to the preset format: $python added after $php, and
# $cmd_duration after the closing cap.
format = """
[░▒▓](#81a1c1)\
$os\
[](bg:#88c0d0 fg:#81a1c1)\
$directory\
[](fg:#88c0d0 bg:#4c566a)\
$git_branch\
$git_status\
[](fg:#4c566a bg:#434c5e)\
$nodejs\
$bun\
$rust\
$golang\
$php\
$python\
[](fg:#434c5e bg:#3b4252)\
$time\
[ ](fg:#3b4252)\
$cmd_duration\
\n$character"""

# Local tweak (not in the preset): show how long slow commands took
[cmd_duration]
min_time = 2000
format = '[ took $duration](fg:#ebcb8b)'

# Local tweak: fixed colours for the prompt symbol. Starship's default
# "bold green" goes through the terminal's ANSI table, which some schemes
# (Solarized) map to grey. Green = last command succeeded, red = it failed.
[character]
success_symbol = '[❯](bold fg:#a3be8c)'
error_symbol = '[❯](bold fg:#bf616a)'
vimcmd_symbol = '[❮](bold fg:#88c0d0)'

[directory]
style = "bold fg:#2e3440 bg:#88c0d0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#4c566a"
format = '[[ $symbol $branch ](fg:#eceff4 bg:#4c566a)]($style)'

[git_status]
style = "bg:#4c566a"
format = '[[($all_status$ahead_behind )](fg:#ebcb8b bg:#4c566a)]($style)'

[nodejs]
symbol = ""
style = "bg:#434c5e"
format = '[[ $symbol ($version) ](fg:#d8dee9 bg:#434c5e)]($style)'

[bun]
symbol = ""
style = "bg:#434c5e"
format = '[[ $symbol ($version) ](fg:#d8dee9 bg:#434c5e)]($style)'

[rust]
symbol = ""
style = "bg:#434c5e"
format = '[[ $symbol ($version) ](fg:#d8dee9 bg:#434c5e)]($style)'

[golang]
symbol = ""
style = "bg:#434c5e"
format = '[[ $symbol ($version) ](fg:#d8dee9 bg:#434c5e)]($style)'

[php]
symbol = ""
style = "bg:#434c5e"
format = '[[ $symbol ($version) ](fg:#d8dee9 bg:#434c5e)]($style)'

# Local tweak: python segment (not in the preset), styled to match
[python]
symbol = ""
style = "bg:#434c5e"
format = '[[ $symbol ($version) ](fg:#d8dee9 bg:#434c5e)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#3b4252"
format = '[[  $time ](fg:#d8dee9 bg:#3b4252)]($style)'

[os]
style = "bg:#81a1c1 fg:#2e3440"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
