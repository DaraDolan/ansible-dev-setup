# ---------------------------------------------------------------------------
# MANAGED BY ANSIBLE - roles/zsh/files/starship.toml
#
# Starship prompt configuration - https://starship.rs/config/
# Deliberately close to the defaults; add overrides here (in the repo, not in
# ~/.config/starship.toml) and re-run:
#     ansible-playbook playbook.yml --tags zsh -K
# ---------------------------------------------------------------------------

# Some segments shell out (git, language version lookups); don't let a slow
# one hang the prompt.
command_timeout = 1000

[directory]
truncation_length = 4
truncate_to_repo = true

# The p10k setup showed language versions only when relevant; starship does
# that by default. Trim the noisier segments we never used.
[package]
disabled = true
