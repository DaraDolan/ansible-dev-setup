    - ansible_os_family == "Debian"
    - ansible_architecture not in fzf_arch_map
  tags:
    - fzf
    - user

- name: Download pinned fzf tarball
  get_url:
    url: >-
      https://github.com/junegunn/fzf/releases/download/v{{ fzf_version }}/fzf-{{ fzf_version }}-linux_{{ fzf_arch_map[ansible_architecture] }}.tar.gz
    dest: "/tmp/fzf_{{ fzf_version }}.tar.gz"
    checksum: "{{ fzf_checksums[ansible_architecture] }}"
    mode: '0644'
  become: false
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture in fzf_arch_map
  tags:
    - fzf
    - user

- name: Extract fzf into ~/.local/bin
  unarchive:
    src: "/tmp/fzf_{{ fzf_version }}.tar.gz"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin"
    remote_src: yes
    include:
      - fzf
    mode: '0755'
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/fzf"
  become: false
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture in fzf_arch_map
  tags:
    - fzf
    - user

- name: Remove the downloaded fzf tarball
  file:
    path: "/tmp/fzf_{{ fzf_version }}.tar.gz"
    state: absent
  become: false
  tags:
    - fzf
    - user

# --- git-delta (pinned tarball; wired in as git's pager below) -------------
- name: Fail clearly if delta has no build for this architecture
  fail:
    msg: >-
      No pinned delta tarball for architecture '{{ ansible_architecture }}'.
      Add it to delta_arch_map and delta_checksums in
      roles/common-software/defaults/main.yml.
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture not in delta_arch_map
  tags:
    - delta
    - git
    - user

- name: Download pinned delta tarball
  get_url:
    url: >-
      https://github.com/dandavison/delta/releases/download/{{ delta_version }}/delta-{{ delta_version }}-{{ delta_arch_map[ansible_architecture] }}-unknown-linux-gnu.tar.gz
    dest: "/tmp/delta_{{ delta_version }}.tar.gz"
    checksum: "{{ delta_checksums[ansible_architecture] }}"
    mode: '0644'
  become: false
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture in delta_arch_map
  tags:
    - delta
    - git
    - user

- name: Extract delta into ~/.local/bin
  unarchive:
    src: "/tmp/delta_{{ delta_version }}.tar.gz"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin"
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
    include:
      - "delta-{{ delta_version }}-{{ delta_arch_map[ansible_architecture] }}-unknown-linux-gnu/delta"
    mode: '0755'
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/delta"
  become: false
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture in delta_arch_map
  tags:
    - delta
    - git
    - user

- name: Remove the downloaded delta tarball
  file:
    path: "/tmp/delta_{{ delta_version }}.tar.gz"
    state: absent
  become: false
  tags:
    - delta
    - git
    - user

- name: Configure git to page diffs through delta
  git_config:
    name: "{{ item.name }}"
    scope: global
    value: "{{ item.value }}"
  loop:
    - { name: core.pager, value: "delta" }
    - { name: interactive.diffFilter, value: "delta --color-only" }
    - { name: delta.navigate, value: "true" }   # n/N jump between files in a diff
  become: false
  when: configure_git | default(true)
  tags:
    - delta
    - git
    - user

# --- Google Cloud CLI (gcloud + bq + gsutil) via Google's apt repo ---------
# Bgate runs data engineering on GCP/BigQuery. Run `gcloud init` once to
# authenticate.
- name: Download and dearmor Google Cloud GPG key
  shell: curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg | gpg --dearmor -o /etc/apt/keyrings/cloud.google.gpg
  args:
    creates: /etc/apt/keyrings/cloud.google.gpg
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - gcloud
    - cloud

- name: Add Google Cloud apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main"
    filename: google-cloud-sdk
    state: present
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - gcloud
    - cloud

- name: Install Google Cloud CLI
  apt:
    name: google-cloud-cli
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - gcloud
    - cloud

# --- Azure CLI via Microsoft's apt repo ------------------------------------
# Bgate hosts its applications on Azure Web Apps. Run `az login` once to
# authenticate.
- name: Download and dearmor Microsoft GPG key
  shell: curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/microsoft.gpg
  args:
    creates: /etc/apt/keyrings/microsoft.gpg
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - azure
    - cloud

- name: Add Azure CLI apt repository
  apt_repository:
    repo: "deb [arch={{ dpkg_arch.stdout | default('amd64') }} signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ {{ ansible_distribution_release }} main"
    filename: azure-cli
    state: present
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - azure
    - cloud

- name: Install Azure CLI
  apt:
    name: azure-cli
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - azure
    - cloud

# sqlcmd (mssql-tools18) and clasp (Apps Script CLI) were deliberately
# deferred on 21 Aug 2026 - add them here if the Bgate work turns out to
# need them from this machine.

# Install win32yank for WSL2 system clipboard support (used by Neovim's unnamedplus clipboard)
- name: Check if running under WSL2
  set_fact:
    is_wsl2: "{{ 'microsoft' in ansible_kernel | lower }}"
  tags:
    - clipboard
    - neovim

- name: Ensure ~/.local/bin exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: '0755'
  when: is_wsl2
  tags:
    - clipboard
    - neovim

- name: Download win32yank
  get_url:
    url: https://github.com/equalsraf/win32yank/releases/download/v0.1.1/win32yank-x64.zip
    dest: /tmp/win32yank.zip
    mode: '0644'
  when: is_wsl2
  tags:
    - clipboard
    - neovim

- name: Extract win32yank.exe to ~/.local/bin
  unarchive:
    src: /tmp/win32yank.zip
    dest: "{{ lookup('env', 'HOME') }}/.local/bin"
    remote_src: yes
    include:
      - win32yank.exe
    mode: '0755'
  when: is_wsl2
  tags:
    - clipboard
    - neovim
