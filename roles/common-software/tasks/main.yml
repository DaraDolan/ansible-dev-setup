---
- name: Include platform-specific variables
  include_vars: "{{ ansible_os_family }}.yml"

- name: Clean apt cache and update
  shell: |
    apt clean
    apt update
  when: ansible_os_family == "Debian"
  become: true

- name: Install packages (Ubuntu)
  apt:
    name: "{{ software_packages }}"
    state: present
    force_apt_get: yes
  when: ansible_os_family == "Debian"
  become: true

- name: Symlink fdfind to fd (Ubuntu's fd-find package installs as fdfind)
  file:
    src: /usr/bin/fdfind
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/fd"
    state: link
    force: yes
  when: ansible_os_family == "Debian"

- name: Symlink batcat to bat (Ubuntu's bat package installs as batcat)
  file:
    src: /usr/bin/batcat
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/bat"
    state: link
    force: yes
  when: ansible_os_family == "Debian"

- name: Install PHP CLI (for Composer, Artisan, Pint)
  apt:
    name:
      - php-cli
      - unzip
    state: present
  when: ansible_os_family == "Debian"
  become: true

- name: Remove snap Node.js installation (migrating to mise)
  snap:
    name: node
    state: absent
  when: ansible_os_family == "Debian"
  become: true
  ignore_errors: true

- name: Install Homebrew packages (macOS)
  homebrew:
    name: "{{ software_packages }}"
    state: present
    update_homebrew: yes
  when: ansible_os_family == "Darwin"

- name: Fix duplicate repository entries
  shell: |
    rm -f /etc/apt/sources.list.d/ppa_neovim_ppa_unstable_jammy.list
  become: true
  when: ansible_os_family == "Debian"
  ignore_errors: true

- name: Install apt-utils
  apt:
    name: apt-utils
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == "Debian"
  ignore_errors: true

- name: Install libc-bin
  apt:
    name: libc-bin
    state: present
  become: true
  when: ansible_os_family == "Debian"
  ignore_errors: true

- name: Install locales
  apt:
    name: locales
    state: present
  become: true
  when: ansible_os_family == "Debian"
  ignore_errors: true

- name: Ensure en_US.UTF-8 locale is available
  lineinfile:
    path: /etc/locale.gen
    regexp: "^# en_US.UTF-8 UTF-8"
    line: "en_US.UTF-8 UTF-8"
    state: present
  become: true
  when: ansible_os_family == "Debian"
  register: locale_gen_file
  ignore_errors: true

- name: Generate locales
  command: locale-gen
  become: true
  when: ansible_os_family == "Debian" and locale_gen_file is success and locale_gen_file.changed
  ignore_errors: true

- name: Set environment variables for UTF-8 support
  blockinfile:
    path: /etc/profile.d/locale.sh
    create: yes
    block: |
      export LANG=en_US.UTF-8
      export LANGUAGE=en_US:en
      export LC_ALL=en_US.UTF-8
  become: true
  when: ansible_os_family == "Debian"
  ignore_errors: true

# Install Claude Code via native installer (enables auto-update)
- name: Install Claude Code
  shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/claude"
  become: false
  tags:
    - claude
    - user

- name: Clean up old Claude Code versions
  shell: |
    current=$(readlink {{ lookup('env', 'HOME') }}/.local/bin/claude | xargs basename)
    ls ~/.local/share/claude/versions/ | grep -v "^${current}$" | while read v; do
      rm -f ~/.local/share/claude/versions/$v
    done
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  tags:
    - claude
    - user

# Create Claude configuration directory and disable telemetry

- name: Create Claude configuration directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.claude"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - claude
    - user

- name: Install Claude settings
  copy:
    src: "claude-settings.json"
    dest: "{{ lookup('env', 'HOME') }}/.claude/settings.json"
    force: yes
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
    mode: 0644
  become: false
  tags:
    - claude
    - user

- name: Install Claude statusline script
  copy:
    src: "statusline-command.sh"
    dest: "{{ lookup('env', 'HOME') }}/.claude/statusline-command.sh"
    force: yes
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
    mode: 0755
  become: false
  tags:
    - claude
    - user

- name: Create Claude commands directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.claude/commands"
    state: directory
    mode: 0775
  become: false
  tags:
    - claude
    - user

- name: Install Claude custom commands
  copy:
    src: "claude-commands/"
    dest: "{{ lookup('env', 'HOME') }}/.claude/commands/"
    mode: 0644
  become: false
  tags:
    - claude
    - user

- name: Create Claude global memory directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.claude/memory"
    state: directory
    mode: 0755
  become: false
  tags:
    - claude
    - user

- name: Install Claude global memory files
  copy:
    src: "claude-memory/"
    dest: "{{ lookup('env', 'HOME') }}/.claude/memory/"
    force: no
    mode: 0644
  become: false
  tags:
    - claude
    - user

# Install UV Python package manager
- name: Install UV Python package manager
  shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/uv"
  become: false
  tags:
    - user

- name: Add UV to PATH in shell profile
  lineinfile:
    path: "{{ lookup('env', 'HOME') }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    state: present
  become: false
  tags:
    - user

# The "Add UV to PATH in zsh profile" lineinfile task was removed here.
# roles/zsh copies ~/.zshrc over the top of it later in the same play, so this
# line was discarded on every run. ~/.local/bin is on PATH via
# roles/zsh/files/zshrc instead. The .bashrc task above is kept: no role owns
# ~/.bashrc, so appending to it is safe.

# Install mise for Node.js version management
- name: Install mise version manager
  shell: curl https://mise.run | sh
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/mise"
  become: false
  tags:
    - user

- name: Create mise config directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/mise"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - user

- name: Configure mise for Node.js LTS
  copy:
    dest: "{{ lookup('env', 'HOME') }}/.config/mise/config.toml"
    content: |
      [tools]
      node = "lts"
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
    mode: 0644
  become: false
  tags:
    - user

- name: Install Node.js LTS via mise
  shell: |
    export PATH="$HOME/.local/bin:$PATH"
    ~/.local/bin/mise install
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  ignore_errors: true
  tags:
    - user

# Yarn support (via Node's built-in Corepack, not a separate npm/mise install)
- name: Enable Corepack for Yarn support
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
    corepack enable
  args:
    executable: /bin/bash
  become: false
  register: corepack_enable
  changed_when: false
  failed_when: false
  tags:
    - yarn
    - corepack
    - user

- name: Warn if Corepack enable failed
  debug:
    msg: "Corepack enable failed (rc={{ corepack_enable.rc }}): {{ corepack_enable.stderr }}"
  when: corepack_enable.rc != 0
  tags:
    - yarn
    - corepack

- name: Activate Yarn via Corepack
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
    corepack prepare yarn@stable --activate
  args:
    executable: /bin/bash
  become: false
  when: corepack_enable.rc == 0
  register: yarn_activate
  changed_when: false
  failed_when: false
  tags:
    - yarn
    - corepack
    - user

- name: Warn if Yarn activation failed
  debug:
    msg: "Yarn activation via Corepack failed (rc={{ yarn_activate.rc }}): {{ yarn_activate.stderr }}"
  when: corepack_enable.rc == 0 and yarn_activate.rc != 0
  tags:
    - yarn
    - corepack

# Configure Git settings (configurable via variables)
- name: Set Git user name
  git_config:
    name: user.name
    scope: "{{ git_config_scope }}"
    value: "{{ git_user_name }}"
  become: false
  when: configure_git | default(true)
  tags:
    - user

- name: Set Git user email
  git_config:
    name: user.email
    scope: "{{ git_config_scope }}"
    value: "{{ git_user_email }}"
  become: false
  when: configure_git | default(true)
  tags:
    - user

- name: Set Git default branch
  git_config:
    name: init.defaultBranch
    scope: "{{ git_config_scope }}"
    value: "{{ git_default_branch }}"
  become: false
  when: configure_git | default(true)
  tags:
    - user

- name: Set Git pull strategy
  git_config:
    name: pull.rebase
    scope: "{{ git_config_scope }}"
    value: "{{ git_pull_rebase | string | lower }}"
  become: false
  when: configure_git | default(true)
  tags:
    - user

# Configure git aliases
- name: Configure git aliases
  git_config:
    name: alias.trim
    value: '!git diff --cached --name-only -z | xargs -0 sed -i "s/[[:space:]]*$//"'
    scope: global
  become: false
  when: configure_git | default(true)
  tags:
    - user

# npm-based global tool installs (Prettier, Gemini CLI, tree-sitter-cli, Playwright)
# each tool below is independent: a failure in one must not skip the others.
- name: Check if npm is available via mise
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
    npm --version
  args:
    executable: /bin/bash
  become: false
  register: npm_check
  changed_when: false
  failed_when: false
  tags:
    - always

- name: Warn if npm is not available via mise
  debug:
    msg: "npm not available via mise (rc={{ npm_check.rc }}); skipping Prettier, Gemini CLI, tree-sitter-cli, and Playwright installs. stderr: {{ npm_check.stderr }}"
  when: npm_check.rc != 0
  tags:
    - always

- name: Install Prettier globally for code formatting via mise
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
    npm install -g prettier
  args:
    executable: /bin/bash
  become: false
  when: npm_check.rc == 0
  register: prettier_install
  changed_when: false
  failed_when: false
  tags:
    - prettier
    - formatting
    - user

- name: Warn if Prettier install failed
  debug:
    msg: "Prettier install failed (rc={{ prettier_install.rc }}): {{ prettier_install.stderr }}"
  when: npm_check.rc == 0 and prettier_install.rc != 0
  tags:
    - prettier
    - formatting

- name: Install tree-sitter CLI for Neovim treesitter parser compilation
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
    npm install -g tree-sitter-cli
  args:
    executable: /bin/bash
  become: false
  when: npm_check.rc == 0
  register: tree_sitter_cli_install
  changed_when: false
  failed_when: false
  tags:
    - neovim
    - treesitter
    - user

- name: Warn if tree-sitter-cli install failed
  debug:
    msg: "tree-sitter-cli install failed (rc={{ tree_sitter_cli_install.rc }}): {{ tree_sitter_cli_install.stderr }}"
  when: npm_check.rc == 0 and tree_sitter_cli_install.rc != 0
  tags:
    - neovim
    - treesitter

# The eslint_d install was removed here: the eslint language server (mason)
# already provides JS/TS diagnostics in Neovim, and running eslint_d through
# nvim-lint on top of it duplicated every warning.

# Install Playwright for web automation and MCP server support
- name: Install Playwright and its browser/system dependencies
  block:
    - name: Install Playwright test package globally via mise
      shell: |
        export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
        eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
        npm install -g @playwright/test
      args:
        executable: /bin/bash
      changed_when: false

    # The only task in the block that runs as root, which breaks every
    # user-scoped way of reaching Node. Three separate traps, in the order we
    # hit them:
    #   1. bare `$HOME` expands to /root under become, so the shims path
    #      pointed at /root/.local/share/mise/shims -> "command not found: npx"
    #   2. `mise activate` under root's HOME drops the shims back off PATH and
    #      npx then resolves to /mnt/c/Program Files/nodejs/npx over WSL
    #      interop (npm/npx/corepack ship as extensionless scripts, so unlike
    #      bare `node` they ARE reachable from Linux)
    #   3. the shims themselves re-resolve through the invoking user's mise
    #      state, so as root they abort with "npx is not a valid shim"
    # So: no $HOME, no mise, no npx. Call the real binary directly off the
    # versioned install dir. See mise_node_bin in defaults/main.yml.
    - name: Install Playwright system dependencies
      shell: |
        export PATH="{{ mise_node_bin }}:$PATH"
        playwright install-deps
      args:
        executable: /bin/bash
      become: true
      changed_when: "'Installing' in playwright_deps.stdout"
      register: playwright_deps

    - name: Install Chromium browser for Playwright
      shell: |
        export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
        eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
        npx playwright install chromium
      args:
        executable: /bin/bash
      changed_when: "'Downloading' in chrome_install.stdout"
      register: chrome_install

    - name: Verify Playwright installation
      shell: |
        export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
        eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
        npx playwright --version
      args:
        executable: /bin/bash
      register: playwright_version
      changed_when: false

  rescue:
    - name: Warn that Playwright installation failed
      debug:
        msg: "Playwright installation failed: {{ ansible_failed_result.msg | default('see task output above') }}"

  become: false
  when: npm_check.rc == 0 and (install_playwright | default(true))
  tags:
    - playwright
    - web-automation
    - testing

# Install GitHub CLI (gh) via first-party apt repository
- name: Get dpkg architecture for GitHub CLI repo
  command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false
  when: ansible_os_family == "Debian"
  tags:
    - github

- name: Ensure /etc/apt/keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - github

- name: Download GitHub CLI GPG key
  get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: '0644'
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - github

- name: Add GitHub CLI apt repository
  apt_repository:
    repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
    filename: github-cli
    state: present
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - github

- name: Install GitHub CLI
  apt:
    name: gh
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - github

- name: Remind user to authenticate with GitHub CLI
  debug:
    msg: "GitHub CLI installed. Run 'gh auth login' to authenticate with your GitHub account."
  tags:
    - github

# Install glow for rendering markdown files in the terminal
- name: Ensure /etc/apt/keyrings directory exists (Charm)
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - glow
    - markdown

- name: Download and dearmor Charm GPG key
  shell: curl -fsSL https://repo.charm.sh/apt/gpg.key | gpg --dearmor -o /etc/apt/keyrings/charm.gpg
  args:
    creates: /etc/apt/keyrings/charm.gpg
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - glow
    - markdown

- name: Add Charm apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *"
    filename: charm
    state: present
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - glow
    - markdown

- name: Install glow
  apt:
    name: glow
    state: present
    update_cache: yes
  become: true
  when: ansible_os_family == "Debian"
  tags:
    - glow
    - markdown

- name: Create zsh completions directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.zsh/completions"
    state: directory
    mode: '0755'
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - glow
    - markdown

- name: Generate glow zsh completion script
  shell: glow completion zsh > "{{ lookup('env', 'HOME') }}/.zsh/completions/_glow"
  args:
    executable: /bin/bash
    creates: "{{ lookup('env', 'HOME') }}/.zsh/completions/_glow"
  become: false
  tags:
    - glow
    - markdown

# Install lazygit. The Neovim config binds <leader>gg to a lazygit floating
# terminal (toggleterm), which errored at runtime because nothing installed
# the binary. See AUDIT.md section 5.3.
- name: Fail clearly if lazygit has no build for this architecture
  fail:
    msg: >-
      No pinned lazygit tarball for architecture '{{ ansible_architecture }}'.
      Add it to lazygit_arch_map and lazygit_checksums in
      roles/common-software/defaults/main.yml.
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture not in lazygit_arch_map
  tags:
    - lazygit
    - git
    - user

- name: Ensure ~/.local/bin exists for lazygit
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: '0755'
  become: false
  tags:
    - lazygit
    - git
    - user

- name: Download pinned lazygit tarball
  get_url:
    url: >-
      https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version }}/lazygit_{{ lazygit_version }}_linux_{{ lazygit_arch_map[ansible_architecture] }}.tar.gz
    dest: "/tmp/lazygit_{{ lazygit_version }}.tar.gz"
    checksum: "{{ lazygit_checksums[ansible_architecture] }}"
    mode: '0644'
  become: false
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture in lazygit_arch_map
  tags:
    - lazygit
    - git
    - user

- name: Extract lazygit into ~/.local/bin
  unarchive:
    src: "/tmp/lazygit_{{ lazygit_version }}.tar.gz"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin"
    remote_src: yes
    include:
      - lazygit
    mode: '0755'
    creates: "{{ lookup('env', 'HOME') }}/.local/bin/lazygit"
  become: false
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture in lazygit_arch_map
  tags:
    - lazygit
    - git
    - user

- name: Remove the downloaded lazygit tarball
  file:
    path: "/tmp/lazygit_{{ lazygit_version }}.tar.gz"
    state: absent
  become: false
  tags:
    - lazygit
    - git
    - user

# --- fzf (pinned tarball; see defaults/main.yml for why not apt) ----------
