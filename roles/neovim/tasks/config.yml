---
# Neovim configuration deployment: config files, lockfile, plugin install
# (via handlers/main.yml) and post-install fixups. No sudo needed.
#
# Imported by main.yml for a full run, and run on its own by
# update-config.yml (or `--tags config`) to push config changes quickly.
# This is the single copy of this logic; don't duplicate it elsewhere.

# Create config directories
- name: Create base config directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.config"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - neovim
    - user

- name: Create Neovim configuration directories
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/nvim/{{ item }}"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  with_items:
    - ""
    - "lua"
    - "lua/core"
    - "lua/plugins"
    - "snippets"
  become: false
  tags:
    - neovim
    - user

# Bootstrap only. lazy-lock.json owns lazy.nvim's commit and `Lazy! restore`
# checks it out; with update: yes this task moved it back to `stable` and the
# two swapped the checkout on every run.
- name: Ensure lazy.nvim plugin manager is installed
  git:
    repo: 'https://github.com/folke/lazy.nvim.git'
    dest: "{{ lookup('env', 'HOME') }}/.local/share/nvim/lazy/lazy.nvim"
    version: stable
    clone: yes
    update: no
  become: false
  notify:
    - Install and pin plugins via lazy.nvim
    - Compile treesitter parsers
  tags:
    - neovim
    - user

- name: Create Intelephense config directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/intelephense"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - neovim
    - user

- name: Install Intelephense Premium license key
  copy:
    content: "00QWFAL4F6OR8QP"
    dest: "{{ lookup('env', 'HOME') }}/.config/intelephense/licence.txt"
    mode: 0600
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - neovim
    - user

# Copy configuration files
- name: Copy Neovim main configuration
  copy:
    src: "init.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/init.lua"
    force: yes
  become: false
  tags:
    - neovim
    - user

- name: Copy Neovim core configuration files
  copy:
    src: "lua/core/"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/core/"
    force: yes
  become: false
  # lua/core/treesitter_parsers.lua holds the parser list.
  notify: Compile treesitter parsers
  tags:
    - neovim
    - user

- name: Copy Neovim plugin configuration files
  copy:
    src: "lua/plugins/"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/"
    force: yes
  become: false
  notify:
    - Install and pin plugins via lazy.nvim
    - Compile treesitter parsers
  tags:
    - neovim
    - user

- name: Copy Neovim snippet files
  copy:
    src: "snippets/{{ item }}"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/snippets/{{ item }}"
    force: yes
  with_items:
    - "php.json"
    - "markdown.json"
    - "javascript.json"
    - "typescript.json"
    - "typescriptreact.json"
    - "python.json"
  become: false
  tags:
    - neovim
    - user

# Pins every plugin to a known commit so two machines provisioned weeks apart
# get an identical editor. Must land before the `Lazy! restore` handler runs.
#
# The repo is the source of truth: this is copied with force. After running
# `:Lazy update` locally and confirming the result, copy the lockfile back:
#   cp ~/.config/nvim/lazy-lock.json roles/neovim/files/lazy-lock.json
- name: Install pinned lazy.nvim lockfile
  copy:
    src: "lazy-lock.json"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lazy-lock.json"
    force: yes
    mode: 0644
  become: false
  notify:
    - Install and pin plugins via lazy.nvim
    - Compile treesitter parsers
  tags:
    - neovim
    - user

# Create data directories
- name: Create Neovim data directories
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/nvim/{{ item }}"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  with_items:
    - "site"
    - "undo"
  become: false
  tags:
    - neovim
    - user

# Install plugins and compile treesitter parsers (handlers/main.yml) now, not
# at the end of the play: the fzf-native build, the ts_ls patch and the
# healthcheck below all need the plugins on disk. On a fresh machine the
# lazy.nvim clone and the config/lockfile copies above have all notified.
- name: Run pending plugin install and treesitter handlers
  meta: flush_handlers
  tags:
    - neovim
    - user

- name: Build Telescope FZF native extension
  shell: cd {{ lookup('env', 'HOME') }}/.local/share/nvim/lazy/telescope-fzf-native.nvim && make
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/share/nvim/lazy/telescope-fzf-native.nvim/build"
  register: fzf_build
  failed_when: false
  become: false
  when: ansible_facts.os_family == "Debian"
  tags:
    - neovim
    - user

# Fix nvim-lspconfig ts_ls bug (double-wrapped table issue)
- name: Fix ts_ls.lua root_dir bug in nvim-lspconfig
  replace:
    path: "{{ lookup('env', 'HOME') }}/.local/share/nvim/lazy/nvim-lspconfig/lsp/ts_ls.lua"
    regexp: 'local project_root = vim\.fs\.root\(bufnr, \{ project_root_markers \}\)'
    replace: 'local project_root = vim.fs.root(bufnr, project_root_markers)'
  become: false
  ignore_errors: yes
  tags:
    - neovim
    - user
