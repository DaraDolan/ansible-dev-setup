---
- name: Include platform-specific variables
  include_vars: "{{ ansible_os_family }}.yml"

# Install Neovim repository and dependencies
- name: Install software-properties-common (for add-apt-repository)
  apt:
    name: software-properties-common
    state: present
  when: ansible_os_family == "Debian"
  become: true

- name: Remove Neovim unstable PPA (if present)
  apt_repository:
    repo: ppa:neovim-ppa/unstable
    state: absent
  when: ansible_os_family == "Debian"
  become: true
  ignore_errors: true

- name: Remove Neovim stable PPA (if present)
  apt_repository:
    repo: ppa:neovim-ppa/stable
    state: absent
  when: ansible_os_family == "Debian"
  become: true
  ignore_errors: true

- name: Remove apt-installed Neovim (superseded by the pinned tarball)
  apt:
    name: neovim
    state: absent
  when: ansible_os_family == "Debian"
  become: true

# Install Neovim from the official static tarball into $HOME.
#
# This replaces the previous `snap install nvim --classic`. Snap requires
# systemd, which is opt-in under WSL2 (/etc/wsl.conf `systemd=true`) and is
# not managed by this repo, and snapd is absent from many hardened corporate
# Ubuntu images. The tarball needs neither systemd nor sudo, so it also works
# under `--tags user` on a machine where you have no admin rights.
- name: Select the Neovim release asset for this architecture
  set_fact:
    neovim_asset: "nvim-linux-{{ neovim_arch_map[ansible_architecture] }}.tar.gz"
    neovim_checksum: "{{ neovim_tarball_checksums[ansible_architecture] }}"
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture in neovim_arch_map
  tags:
    - neovim
    - user

- name: Fail clearly on an unsupported CPU architecture
  fail:
    msg: >-
      No pinned Neovim tarball for architecture '{{ ansible_architecture }}'.
      Add it to neovim_arch_map and neovim_tarball_checksums in
      roles/neovim/defaults/main.yml.
  when:
    - ansible_os_family == "Debian"
    - ansible_architecture not in neovim_arch_map
  tags:
    - neovim
    - user

- name: Ensure ~/.local/bin exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: '0755'
  become: false
  tags:
    - neovim
    - user

- name: Create versioned Neovim install directory
  file:
    path: "{{ neovim_install_root }}/{{ neovim_version }}"
    state: directory
    mode: '0755'
  become: false
  when: ansible_os_family == "Debian"
  tags:
    - neovim
    - user

- name: Download pinned Neovim tarball
  get_url:
    url: "https://github.com/neovim/neovim/releases/download/{{ neovim_version }}/{{ neovim_asset }}"
    dest: "/tmp/{{ neovim_asset }}"
    checksum: "{{ neovim_checksum }}"
    mode: '0644'
  become: false
  when: ansible_os_family == "Debian"
  tags:
    - neovim
    - user

- name: Extract Neovim tarball
  unarchive:
    src: "/tmp/{{ neovim_asset }}"
    dest: "{{ neovim_install_root }}/{{ neovim_version }}"
    remote_src: yes
    extra_opts:
      - "--strip-components=1"
    creates: "{{ neovim_install_root }}/{{ neovim_version }}/bin/nvim"
  become: false
  when: ansible_os_family == "Debian"
  tags:
    - neovim
    - user

# nvim resolves its runtime directory from the realpath of the executable,
# so symlinking bin/nvim keeps ../share/nvim discoverable.
- name: Link the pinned Neovim into ~/.local/bin
  file:
    src: "{{ neovim_install_root }}/{{ neovim_version }}/bin/nvim"
    dest: "{{ lookup('env', 'HOME') }}/.local/bin/nvim"
    state: link
    force: yes
  become: false
  when: ansible_os_family == "Debian"
  tags:
    - neovim
    - user

- name: Remove the downloaded Neovim tarball
  file:
    path: "/tmp/{{ neovim_asset }}"
    state: absent
  become: false
  when: ansible_os_family == "Debian"
  tags:
    - neovim
    - user

# Done last so the machine is never left without a working nvim. Needs sudo,
# so it is deliberately outside the `user` tag; skipping it just leaves a
# stale snap that ~/.local/bin shadows on PATH.
- name: Remove snap-installed Neovim (superseded by the pinned tarball)
  community.general.snap:
    name: nvim
    state: absent
  become: true
  when: ansible_os_family == "Debian"
  failed_when: false
  tags:
    - neovim

- name: Install Neovim and dependencies (macOS)
  homebrew:
    name: "{{ item }}"
    state: present
  with_items: "{{ neovim_packages }}"
  when: ansible_os_family == "Darwin"

- name: Create Python virtual environment for Neovim (using uv)
  shell: '{{ lookup("env", "HOME") }}/.local/bin/uv venv --python 3 "{{ lookup("env", "HOME") }}/.config/nvim/env"'
  args:
    creates: "{{ lookup('env', 'HOME') }}/.config/nvim/env/bin/python"
  become: false
  tags:
    - neovim
    - user

- name: Install pynvim in the virtual environment (using uv)
  shell: '{{ lookup("env", "HOME") }}/.local/bin/uv pip install pynvim -p "{{ lookup("env", "HOME") }}/.config/nvim/env/bin/python"'
  args:
    creates: "{{ lookup('env', 'HOME') }}/.config/nvim/env/lib/python*/site-packages/pynvim"
  become: false
  tags:
    - neovim
    - user


# Install Python and Node.js providers for Neovim

- name: Install Node.js provider for Neovim (via mise)
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    eval "$({{ lookup('env', 'HOME') }}/.local/bin/mise activate bash)"
    npm install -g neovim
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  tags:
    - neovim
    - user

# The Perl/Ruby provider installs (perl, cpanminus, Neovim::Ext, ruby,
# ruby-dev) were removed here: lua/core/options.lua disables both providers,
# so they were minutes of install/build time for nothing (AUDIT.md §5.2).
# luarocks and the apt fzf package went with them — telescope-fzf-native
# compiles its own matcher and never used the fzf binary.

# Create config directories
- name: Create base config directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.config"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - neovim
    - user

- name: Create Neovim configuration directories
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/nvim/{{ item }}"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  with_items:
    - ""
    - "lua"
    - "lua/core"
    - "lua/plugins"
    - "snippets"
  become: false
  tags:
    - neovim
    - user

- name: Ensure lazy.nvim plugin manager is installed
  git:
    repo: 'https://github.com/folke/lazy.nvim.git'
    dest: "{{ lookup('env', 'HOME') }}/.local/share/nvim/lazy/lazy.nvim"
    version: stable
    clone: yes
    update: yes
  become: false
  tags:
    - neovim
    - user

- name: Create Intelephense config directory
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/intelephense"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - neovim
    - user

- name: Install Intelephense Premium license key
  copy:
    content: "00QWFAL4F6OR8QP"
    dest: "{{ lookup('env', 'HOME') }}/.config/intelephense/licence.txt"
    mode: 0600
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - neovim
    - user

# Copy configuration files
- name: Ensure init.lua file exists
  file:
    path: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/core/init.lua"
    state: touch
    mode: 0644
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  become: false
  tags:
    - neovim
    - user

- name: Copy Neovim main configuration
  copy:
    src: "init.lua"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/init.lua"
    force: yes
  become: false
  tags:
    - neovim
    - user

- name: Copy Neovim core configuration files
  copy:
    src: "lua/core/"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/core/"
    force: yes
  become: false
  tags:
    - neovim
    - user

- name: Copy Neovim plugin configuration files
  copy:
    src: "lua/plugins/"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/plugins/"
    force: yes
  become: false
  tags:
    - neovim
    - user

- name: Copy Neovim snippet files
  copy:
    src: "snippets/{{ item }}"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/snippets/{{ item }}"
    force: yes
  with_items:
    - "php.json"
    - "markdown.json"
    - "javascript.json"
    - "typescript.json"
    - "typescriptreact.json"
    - "python.json"
  become: false
  tags:
    - neovim
    - user

# Pins every plugin to a known commit so two machines provisioned weeks apart
# get an identical editor. Must land before `Lazy! restore` below.
#
# The repo is the source of truth: this is copied with force. After running
# `:Lazy update` locally and confirming the result, copy the lockfile back:
#   cp ~/.config/nvim/lazy-lock.json roles/neovim/files/lazy-lock.json
- name: Install pinned lazy.nvim lockfile
  copy:
    src: "lazy-lock.json"
    dest: "{{ lookup('env', 'HOME') }}/.config/nvim/lazy-lock.json"
    force: yes
    mode: 0644
  become: false
  tags:
    - neovim
    - user

# Create data directories
- name: Create Neovim data directories
  file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/nvim/{{ item }}"
    state: directory
    mode: 0755
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
  with_items:
    - "site"
    - "undo"
  become: false
  tags:
    - neovim
    - user

# Install Nerd Fonts
- name: Install Nerd Font (macOS)
  homebrew:
    name: font-hack-nerd-font
    state: present
    cask: yes
  when: ansible_os_family == "Darwin"

- name: Inform about manual font installation (Linux)
  debug:
    msg: "For the best experience, please install a Nerd Font manually: https://www.nerdfonts.com/font-downloads"
  when: ansible_os_family == "Debian"

# Install plugins and compile treesitter parsers
# `Lazy! restore` installs anything missing and then checks out exactly the
# commits in lazy-lock.json. `Lazy sync` was doing the opposite: updating every
# plugin to its latest commit and rewriting the lockfile on every run.
#
# The mise shims on PATH matter here: plugins with npm build steps
# (markdown-preview.nvim runs `cd app && npm install`) silently fail to build
# without them, because Ansible's default PATH has no node.
- name: Install and pin plugins via lazy.nvim
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    nvim --headless "+Lazy! restore" +qa
  args:
    executable: /bin/bash
  become: false
  environment:
    CC: gcc
  timeout: 600
  tags:
    - neovim
    - user

- name: Build Telescope FZF native extension
  shell: cd {{ lookup('env', 'HOME') }}/.local/share/nvim/lazy/telescope-fzf-native.nvim && make
  args:
    creates: "{{ lookup('env', 'HOME') }}/.local/share/nvim/lazy/telescope-fzf-native.nvim/build"
  register: fzf_build
  failed_when: false
  become: false
  when: ansible_os_family == "Debian"
  tags:
    - neovim
    - user

- name: Compile treesitter parsers
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    nvim --headless -c "TSUpdate" -c "sleep 30" -c "qa"
  args:
    executable: /bin/bash
  become: false
  environment:
    CC: gcc
  timeout: 300
  tags:
    - neovim
    - user

# Fix nvim-lspconfig ts_ls bug (double-wrapped table issue)
- name: Fix ts_ls.lua root_dir bug in nvim-lspconfig
  replace:
    path: "{{ lookup('env', 'HOME') }}/.local/share/nvim/lazy/nvim-lspconfig/lsp/ts_ls.lua"
    regexp: 'local project_root = vim\.fs\.root\(bufnr, \{ project_root_markers \}\)'
    replace: 'local project_root = vim.fs.root(bufnr, project_root_markers)'
  become: false
  ignore_errors: yes
  tags:
    - neovim
    - user

# Verification
# become: false matters — without it this inherits the play-level `become: yes`
# and reports root's Neovim health against root's config, not yours.
- name: Verify Neovim setup with healthcheck
  shell: |
    export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
    nvim --headless -c "checkhealth" -c "q" > /tmp/nvim_health_check.log 2>&1
  args:
    executable: /bin/bash
  become: false
  changed_when: false
  failed_when: false
  register: health_check
  tags:
    - neovim
    - user

- name: Display healthcheck results location
  debug:
    msg: "Neovim health check log available at /tmp/nvim_health_check.log"

- name: Configure Neovim to use pynvim from virtual environment
  blockinfile:
    path: "{{ lookup('env', 'HOME') }}/.config/nvim/lua/core/init.lua"
    block: |
      -- Set Python provider path
      vim.g.python3_host_prog = "{{ lookup('env', 'HOME') }}/.config/nvim/env/bin/python"
    insertafter: "-- Core configuration loader"
    marker: "-- {mark} ANSIBLE MANAGED BLOCK"
  become: false
  ignore_errors: true
  tags:
    - neovim
    - user
