---
# Push Neovim config changes without reinstalling packages. No sudo needed:
#
#   ansible-playbook update-config.yml
#
# Runs roles/neovim/tasks/config.yml, the same tasks a full playbook run
# uses, so the two can't drift apart. Plugins and treesitter parsers are
# (re)installed by the role's handlers only when a copied file changed.
- name: Update Neovim configuration only
  hosts: localhost
  connection: local
  become: false

  tasks:
    - name: Deploy Neovim configuration
      include_role:
        name: neovim
        tasks_from: config.yml
