[defaults]
inventory = inventory/hosts.yml
roles_path = roles
retry_files_enabled = false
# Facts are read via ansible_facts.<name> only. This is the default from
# ansible-core 2.24; setting it now turns any leftover top-level fact
# reference (ansible_os_family etc.) into an error instead of a warning.
inject_facts_as_vars = False
# The only target is localhost, and discovery reliably picks the system
# python3; the per-run "discovered Python interpreter" warning is noise.
interpreter_python = auto_silent
# Run already-notified handlers even if a later task fails. Otherwise a
# failure between a Neovim config/lockfile change and the flush would lose
# the Lazy! restore / TSUpdate notification, and the next run (seeing no
# change) would never re-trigger it.
force_handlers = True
